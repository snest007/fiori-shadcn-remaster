name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.ui5
          key: ${{ runner.os }}-ui5-${{ hashFiles('sapui5/ui5.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate && pnpm typecheck && pnpm registry:build && pnpm build
      - run: pnpm exec playwright test --retries=0
        env:
          PORT: 4310
          SAPUI5_PORT: 4311
      - run: pnpm storybook:build && pnpm test:storybook
        env:
          PORT: 4310
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
