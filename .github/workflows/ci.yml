name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Shard counts are defined only by the matrices below; commands use strategy.job-total.
  # Main CI spent only 18s generating/checking/building. Rebuild in each job:
  # transferring generated source + dist would not avoid Playwright's server build.
  build:
    runs-on: ubuntu-latest
    # E6 targets about 12 minutes per job; this is only the hard kill. `playwright install --with-deps`
    # (apt) sometimes takes 8 minutes on a slow runner, which cancelled jobs whose tests were all passing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && pnpm typecheck && pnpm registry:build && pnpm build

  test:
    runs-on: ubuntu-latest
    # Match scripts/ci-local.sh: browsers, system packages and fonts are already in the image.
    # Keep Playwright's CI container options and the existing pixel-rendering launch flags.
    container: &playwright-container
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    # E7 measures at 20 minutes first; lower to 15 once CI meets the 12-minute job target.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Main run 44480683049: non-visual phases 332/150/212/155s; visual phases
      # 311/254/74/78s. Keep four shards and one serial reference phase per runner.
      matrix:
        include:
          - shard: 1
            visual: visual-phone
          - shard: 2
            visual: visual
          - shard: 3
            visual: visual-interaction
          - shard: 4
            visual: visual-sapui5
    env:
      PORT: 4310
      SAPUI5_PORT: 4311
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.ui5
          key: ${{ runner.os }}-ui5-${{ hashFiles('sapui5/ui5.yaml') }}
      - run: pnpm install --frozen-lockfile
      - &verify-playwright
        name: Verify bundled Playwright Chromium
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const version = require('@playwright/test/package.json').version
          const workflow = fs.readFileSync('.github/workflows/ci.yml', 'utf8')
          const local = fs.readFileSync('scripts/ci-local.sh', 'utf8')
          const imageVersion = /mcr\.microsoft\.com\/playwright:v([\d.]+)-noble/
          if (workflow.match(imageVersion)?.[1] !== version || local.match(imageVersion)?.[1] !== version) {
            throw new Error('CI and ci-local.sh images must match the installed @playwright/test version')
          }
          const executable = require('@playwright/test').chromium.executablePath()
          if (!fs.existsSync(executable)) throw new Error(`Bundled Chromium is missing: ${executable}`)
          console.log(`Playwright ${version}: bundled Chromium available; no browser or system-package install`)
          NODE
      - run: pnpm generate && pnpm registry:build
      - &start-test-timer
        name: Start test timer
        id: test-timer
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Non-visual shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          mapfile -t specs < <(git ls-files 'tests/*.spec.ts' | grep -vE '/visual(-sapui5|-phone|-interaction)?\.spec\.ts$')
          pnpm test:summary "${specs[@]}" --shard=${{ matrix.shard }}/${{ strategy.job-total }} --retries=0
          mkdir -p "$RUNNER_TEMP/non-visual-results"
          cp -a test-results/. "$RUNNER_TEMP/non-visual-results/"
      - name: Serial ${{ matrix.visual }} comparisons
        run: pnpm test:summary tests/${{ matrix.visual }}.spec.ts --shard=1/1 --workers=1 --retries=0
      - &report-test-duration
        name: Report test duration
        if: ${{ always() && steps.test-timer.outputs.started != '' }}
        env:
          TEST_STARTED: ${{ steps.test-timer.outputs.started }}
          TEST_JOB: ${{ github.job }} (${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          elapsed=$(( $(date +%s) - TEST_STARTED ))
          printf '%s tests: %dm%02ds (%ds)\n' "$TEST_JOB" "$((elapsed / 60))" "$((elapsed % 60))" "$elapsed"
          if (( elapsed > 600 )); then
            echo "::warning title=CI test duration::$TEST_JOB tests exceeded 10 minutes ($elapsed seconds); add or rebalance a shard in this card."
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            ${{ runner.temp }}/non-visual-results/
          if-no-files-found: ignore

  storybook:
    runs-on: ubuntu-latest
    container: *playwright-container
    # E7 measures at 20 minutes first; lower to 15 once CI meets the 12-minute job target.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Main run 44480683049: 3193 tests, three shards took 826/531/782s.
      # Five project the slowest to 826 * 3 / 5 = 496s (8m16s), below the 9-minute test target.
      # Add a shard when new tests push the slowest past 9 minutes; commands derive the total here.
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      PORT: 4320
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - *verify-playwright
      - run: pnpm generate && pnpm storybook:build
      - *start-test-timer
      - run: pnpm test:summary -c playwright.storybook.config.ts --shard=${{ matrix.shard }}/${{ strategy.job-total }} --retries=0
      - *report-test-duration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-results-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
